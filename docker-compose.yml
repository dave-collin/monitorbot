services:
  monitor-bot:
    build: .
    container_name: monitor-bot
    restart: unless-stopped
    network_mode: host
    pid: host
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock    # docker ps/compose
      - /sys:/sys:ro                                  # CPU temp
      - /proc:/host_proc:ro                           # proses host
      - /:/host_root:ro                               # disk host
